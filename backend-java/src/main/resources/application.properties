# ═══════════════════════════════════════════════════════════════
# Daily Finance API — Application Configuration
# (backend-dev-guidelines: centralized config, no scattered env vars)
# ═══════════════════════════════════════════════════════════════

spring.application.name=daily-finance-api
server.port=8080

# ── H2 Database (local dev) ────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:dailyfinance
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── CORS ───────────────────────────────────────────────────────
# Handled programmatically in SecurityConfig.java

# ── AWS LocalStack (Account-Free Emulator) ─────────────────────
aws.region=us-east-1
aws.s3.endpoint=http://localhost:4566
aws.dynamodb.endpoint=http://localhost:4566
aws.sqs.endpoint=http://localhost:4566
aws.credentials.access-key=test
aws.credentials.secret-key=test
